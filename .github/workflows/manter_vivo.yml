name: Automatismo Anti-Pausa

on:
  schedule:
    - cron: '0 8 * * 2,5'
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Acordar o Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/get_api_version" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

      - name: 2. Descarregar o código do repositório
        uses: actions/checkout@v4
        with:
          # Isto força o checkout a usar a árvore interna sem depender do Node antigo
          sparse-checkout: .github

      - name: 3. Atualizar a data num ficheiro para o GitHub não adormecer
        run: |
          echo "Último ping em: $(date)" > .github/keep_alive.txt

      - name: 4. Fazer o commit automático
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add .github/keep_alive.txt
          git commit -m "chore: keep-alive ping [skip ci]" || exit 0
          git push
